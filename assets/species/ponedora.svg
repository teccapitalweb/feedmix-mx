<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bgPon" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#FFF7E0"/>
      <stop offset="60%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </radialGradient>
    <linearGradient id="bodyPon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F5F1E8"/>
      <stop offset="100%" stop-color="#C9B98B"/>
    </linearGradient>
    <linearGradient id="featherPon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="100%" stop-color="#D4C9A8"/>
    </linearGradient>
    <radialGradient id="combPon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </radialGradient>
    <linearGradient id="beakPon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <radialGradient id="eyePon" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="eggGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FAF6E8"/>
      <stop offset="100%" stop-color="#D4C9A8"/>
    </radialGradient>
    <radialGradient id="strawGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#92400E"/>
    </radialGradient>
    <filter id="softShadowPon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bgPon)"/>

  <!-- Nido de paja -->
  <ellipse cx="200" cy="265" rx="180" ry="22" fill="rgba(146,64,14,0.4)"/>
  <g opacity="0.7">
    <line x1="80" y1="262" x2="100" y2="270" stroke="url(#strawGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="110" y1="265" x2="135" y2="272" stroke="url(#strawGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="280" y1="270" x2="305" y2="262" stroke="url(#strawGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="310" y1="268" x2="335" y2="263" stroke="url(#strawGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="50" y1="270" x2="75" y2="265" stroke="url(#strawGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="340" y1="270" x2="360" y2="265" stroke="url(#strawGrad)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Sombra del cuerpo -->
  <ellipse cx="220" cy="265" rx="100" ry="10" fill="rgba(0,0,0,0.18)"/>

  <!-- Huevo blanco grande adelante -->
  <g filter="url(#softShadowPon)">
    <ellipse cx="120" cy="245" rx="28" ry="36" fill="url(#eggGrad)" stroke="#A8956B" stroke-width="0.5"/>
    <ellipse cx="113" cy="232" rx="8" ry="14" fill="white" opacity="0.5"/>
  </g>

  <!-- GALLINA PONEDORA -->
  <g filter="url(#softShadowPon)">
    <!-- Cuerpo de gallina (alargado, postura) -->
    <ellipse cx="230" cy="185" rx="100" ry="70" fill="url(#bodyPon)"/>

    <!-- Pecho -->
    <ellipse cx="195" cy="200" rx="55" ry="55" fill="url(#featherPon)"/>

    <!-- Ala con detalle de plumas -->
    <path d="M 270 145 Q 320 155 325 195 Q 320 240 270 250 Q 250 245 248 220 Q 245 175 270 145 Z" fill="url(#featherPon)" stroke="#A8956B" stroke-width="0.8"/>
    <path d="M 285 165 Q 305 180 308 200" stroke="#9C8758" stroke-width="1.3" fill="none" opacity="0.7"/>
    <path d="M 280 195 Q 302 205 310 225" stroke="#9C8758" stroke-width="1.3" fill="none" opacity="0.7"/>
    <path d="M 275 220 Q 295 230 302 245" stroke="#9C8758" stroke-width="1.3" fill="none" opacity="0.7"/>

    <!-- Cola erguida -->
    <path d="M 320 165 Q 355 145 360 175 Q 350 195 330 195 Z" fill="url(#featherPon)" stroke="#A8956B" stroke-width="0.8"/>

    <!-- Cuello -->
    <ellipse cx="170" cy="135" rx="28" ry="40" fill="url(#bodyPon)"/>

    <!-- Cabeza pequeña -->
    <circle cx="155" cy="100" r="32" fill="url(#bodyPon)"/>

    <!-- Cresta de gallina (más simple, lados) -->
    <g fill="url(#combPon)">
      <path d="M 138 75 Q 135 60 145 65 Q 150 52 155 65 Q 162 55 167 67 Q 172 58 175 75 Z"/>
    </g>

    <!-- Barbilla doble -->
    <path d="M 148 122 Q 142 138 150 142 Q 158 138 155 122 Z" fill="url(#combPon)"/>

    <!-- Pico -->
    <path d="M 125 102 L 108 102 L 125 110 Z" fill="url(#beakPon)" stroke="#92400E" stroke-width="0.5"/>

    <!-- Ojo -->
    <circle cx="142" cy="95" r="5" fill="#FFFFFF"/>
    <circle cx="141" cy="96" r="3.5" fill="url(#eyePon)"/>
    <circle cx="140" cy="94.5" r="1.3" fill="#FFFFFF"/>

    <!-- Patas amarillas -->
    <g>
      <line x1="200" y1="252" x2="200" y2="278" stroke="url(#beakPon)" stroke-width="4" stroke-linecap="round"/>
      <line x1="240" y1="252" x2="240" y2="278" stroke="url(#beakPon)" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g stroke="url(#beakPon)" stroke-width="2.2" stroke-linecap="round" fill="none">
      <line x1="195" y1="278" x2="187" y2="282"/>
      <line x1="200" y1="278" x2="200" y2="284"/>
      <line x1="205" y1="278" x2="213" y2="282"/>
      <line x1="235" y1="278" x2="227" y2="282"/>
      <line x1="240" y1="278" x2="240" y2="284"/>
      <line x1="245" y1="278" x2="253" y2="282"/>
    </g>
  </g>

  <!-- Reflejo del cuerpo -->
  <ellipse cx="195" cy="155" rx="22" ry="35" fill="white" opacity="0.22"/>
</svg>
