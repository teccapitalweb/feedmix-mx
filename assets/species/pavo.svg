<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bgPav" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#F5F0E8"/>
      <stop offset="60%" stop-color="#D6BFA0"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </radialGradient>
    <linearGradient id="bodyPav" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="50%" stop-color="#7C2D12"/>
      <stop offset="100%" stop-color="#1C1917"/>
    </linearGradient>
    <linearGradient id="featherPav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="50%" stop-color="#451A03"/>
      <stop offset="100%" stop-color="#1C1917"/>
    </linearGradient>
    <radialGradient id="headPav" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </radialGradient>
    <linearGradient id="snoodPav" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <linearGradient id="beakPav" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A8A29E"/>
      <stop offset="100%" stop-color="#44403C"/>
    </linearGradient>
    <linearGradient id="tailPav" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    <filter id="softShadowPav" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bgPav)"/>

  <!-- Sombra -->
  <ellipse cx="200" cy="280" rx="170" ry="14" fill="rgba(0,0,0,0.25)"/>

  <!-- PAVO -->
  <g filter="url(#softShadowPav)">

    <!-- Cola en abanico (característica del pavo macho) -->
    <g>
      <!-- Plumas de la cola -->
      <path d="M 280 100 Q 350 70 360 130 L 350 145 Q 310 130 285 130 Z" fill="url(#tailPav)"/>
      <path d="M 280 130 Q 360 110 380 165 L 360 175 Q 320 160 285 160 Z" fill="url(#tailPav)" opacity="0.9"/>
      <path d="M 290 165 Q 365 155 375 215 L 350 215 Q 320 195 295 190 Z" fill="url(#tailPav)" opacity="0.85"/>
      <path d="M 295 195 Q 355 200 360 240 L 335 240 Q 315 220 300 215 Z" fill="url(#tailPav)" opacity="0.75"/>

      <!-- Detalles de plumas -->
      <g stroke="#1C1917" stroke-width="1.2" fill="none" opacity="0.4">
        <path d="M 290 110 Q 320 95 350 105"/>
        <path d="M 290 140 Q 325 125 360 140"/>
        <path d="M 295 175 Q 330 160 365 180"/>
        <path d="M 300 210 Q 330 200 350 215"/>
      </g>
    </g>

    <!-- Cuerpo grande del pavo -->
    <ellipse cx="195" cy="200" rx="100" ry="80" fill="url(#bodyPav)"/>

    <!-- Pecho con plumas oscuras -->
    <ellipse cx="170" cy="215" rx="55" ry="65" fill="url(#featherPav)"/>

    <!-- Ala con detalle -->
    <path d="M 235 165 Q 285 175 295 220 Q 285 260 240 265 Q 220 260 215 235 Q 215 185 235 165 Z" fill="url(#bodyPav)" stroke="#1C1917" stroke-width="0.8"/>
    <path d="M 250 185 Q 270 195 275 215" stroke="#FCD34D" stroke-width="1.2" fill="none" opacity="0.5"/>
    <path d="M 245 210 Q 268 220 275 240" stroke="#FCD34D" stroke-width="1.2" fill="none" opacity="0.5"/>
    <path d="M 240 235 Q 260 245 268 258" stroke="#FCD34D" stroke-width="1.2" fill="none" opacity="0.5"/>

    <!-- Cuello largo (característico) -->
    <path d="M 145 140 L 165 195 L 215 195 L 195 130 Z" fill="url(#bodyPav)"/>
    <ellipse cx="155" cy="155" rx="22" ry="35" fill="url(#bodyPav)"/>

    <!-- Cabeza azul/rojiza desnuda (característica) -->
    <ellipse cx="138" cy="115" rx="20" ry="26" fill="url(#headPav)"/>

    <!-- Carúncula colgante (snood) - distintivo del pavo -->
    <path d="M 122 95 Q 110 95 105 110 Q 108 130 118 132 Q 125 125 128 105 Z" fill="url(#snoodPav)"/>
    <ellipse cx="115" cy="115" rx="6" ry="12" fill="#7F1D1D"/>

    <!-- Carúnculas en el cuello -->
    <g fill="url(#snoodPav)">
      <ellipse cx="142" cy="135" rx="6" ry="3"/>
      <ellipse cx="135" cy="145" rx="5" ry="3"/>
      <ellipse cx="148" cy="148" rx="5" ry="3"/>
      <ellipse cx="140" cy="158" rx="5" ry="3"/>
    </g>

    <!-- Pico -->
    <path d="M 122 117 L 105 117 L 122 125 Z" fill="url(#beakPav)" stroke="#1C1917" stroke-width="0.5"/>

    <!-- Ojo -->
    <circle cx="135" cy="108" r="3.5" fill="#FFFFFF"/>
    <circle cx="134.5" cy="109" r="2.5" fill="#1C1917"/>
    <circle cx="134" cy="107.5" r="1" fill="#FFFFFF"/>

    <!-- Barba/cerdas en el pecho (característica del pavo macho) -->
    <g stroke="#1C1917" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
      <line x1="155" y1="180" x2="153" y2="200"/>
      <line x1="158" y1="182" x2="157" y2="205"/>
      <line x1="161" y1="183" x2="160" y2="208"/>
    </g>

    <!-- Patas robustas -->
    <g>
      <line x1="175" y1="265" x2="175" y2="278" stroke="url(#beakPav)" stroke-width="6" stroke-linecap="round"/>
      <line x1="220" y1="265" x2="220" y2="278" stroke="url(#beakPav)" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g stroke="url(#beakPav)" stroke-width="3" stroke-linecap="round" fill="none">
      <line x1="170" y1="278" x2="160" y2="284"/>
      <line x1="175" y1="278" x2="175" y2="286"/>
      <line x1="180" y1="278" x2="190" y2="284"/>
      <line x1="215" y1="278" x2="205" y2="284"/>
      <line x1="220" y1="278" x2="220" y2="286"/>
      <line x1="225" y1="278" x2="235" y2="284"/>
    </g>
  </g>

  <!-- Reflejo -->
  <ellipse cx="180" cy="180" rx="20" ry="35" fill="white" opacity="0.12"/>
</svg>
