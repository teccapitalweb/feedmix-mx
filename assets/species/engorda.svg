<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bgEng" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="60%" stop-color="#FCE9B8"/>
      <stop offset="100%" stop-color="#D4A648"/>
    </radialGradient>
    <linearGradient id="bodyEng" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FAF7F0"/>
      <stop offset="100%" stop-color="#D4C9A8"/>
    </linearGradient>
    <linearGradient id="featherEng" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8DDC0"/>
    </linearGradient>
    <radialGradient id="combEng" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </radialGradient>
    <linearGradient id="beakEng" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <radialGradient id="eyeEng" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fondo cálido amarillo -->
  <rect width="400" height="300" fill="url(#bgEng)"/>

  <!-- Suelo con sombra -->
  <ellipse cx="200" cy="280" rx="160" ry="14" fill="rgba(0,0,0,0.18)"/>

  <!-- Granos de maíz decorativos -->
  <g opacity="0.55">
    <ellipse cx="60" cy="265" rx="6" ry="4" fill="#F59E0B"/>
    <ellipse cx="78" cy="270" rx="5" ry="3.5" fill="#D97706"/>
    <ellipse cx="340" cy="262" rx="6" ry="4" fill="#F59E0B"/>
    <ellipse cx="325" cy="270" rx="5" ry="3.5" fill="#D97706"/>
    <ellipse cx="358" cy="270" rx="4" ry="3" fill="#F59E0B"/>
  </g>

  <!-- POLLO DE ENGORDA -->
  <g filter="url(#softShadow)">
    <!-- Cuerpo robusto (engorda = redondito) -->
    <ellipse cx="200" cy="180" rx="95" ry="80" fill="url(#bodyEng)"/>

    <!-- Pecho prominente -->
    <ellipse cx="170" cy="195" rx="50" ry="60" fill="url(#featherEng)"/>

    <!-- Ala -->
    <path d="M 230 145 Q 280 155 285 200 Q 280 240 240 250 Q 220 245 215 220 Q 210 180 230 145 Z" fill="url(#featherEng)" stroke="#C9B98B" stroke-width="0.8"/>

    <!-- Detalles de plumas en el ala -->
    <path d="M 245 170 Q 265 180 270 200" stroke="#B8A878" stroke-width="1.2" fill="none" opacity="0.6"/>
    <path d="M 240 195 Q 262 205 268 225" stroke="#B8A878" stroke-width="1.2" fill="none" opacity="0.6"/>
    <path d="M 235 220 Q 255 230 260 245" stroke="#B8A878" stroke-width="1.2" fill="none" opacity="0.6"/>

    <!-- Cuello -->
    <ellipse cx="148" cy="135" rx="32" ry="38" fill="url(#bodyEng)"/>

    <!-- Cabeza -->
    <circle cx="135" cy="105" r="38" fill="url(#bodyEng)"/>

    <!-- Cresta roja -->
    <g fill="url(#combEng)">
      <path d="M 110 80 Q 100 60 115 65 Q 120 50 130 60 Q 140 48 148 60 Q 158 52 162 68 Q 170 60 165 80 Z"/>
      <path d="M 120 85 Q 115 75 125 78 Q 130 70 138 78 Q 145 72 150 82 Z" opacity="0.8"/>
    </g>

    <!-- Barbilla -->
    <path d="M 130 130 Q 122 145 130 150 Q 138 145 135 130 Z" fill="url(#combEng)"/>

    <!-- Pico -->
    <path d="M 100 108 L 80 108 L 100 118 Z" fill="url(#beakEng)" stroke="#92400E" stroke-width="0.5"/>

    <!-- Ojo -->
    <circle cx="120" cy="100" r="5.5" fill="#FFFFFF"/>
    <circle cx="119" cy="101" r="4" fill="url(#eyeEng)"/>
    <circle cx="118" cy="99.5" r="1.5" fill="#FFFFFF"/>

    <!-- Patas amarillas robustas -->
    <g stroke="#D97706" stroke-width="3" stroke-linecap="round">
      <line x1="175" y1="255" x2="175" y2="278" stroke-width="5" stroke="url(#beakEng)"/>
      <line x1="215" y1="255" x2="215" y2="278" stroke-width="5" stroke="url(#beakEng)"/>
    </g>
    <!-- Garras -->
    <g stroke="url(#beakEng)" stroke-width="2.5" stroke-linecap="round" fill="none">
      <line x1="170" y1="278" x2="162" y2="282"/>
      <line x1="175" y1="278" x2="175" y2="284"/>
      <line x1="180" y1="278" x2="188" y2="282"/>
      <line x1="210" y1="278" x2="202" y2="282"/>
      <line x1="215" y1="278" x2="215" y2="284"/>
      <line x1="220" y1="278" x2="228" y2="282"/>
    </g>
  </g>

  <!-- Reflejo brillante en el cuerpo -->
  <ellipse cx="160" cy="150" rx="25" ry="40" fill="white" opacity="0.25"/>
</svg>
